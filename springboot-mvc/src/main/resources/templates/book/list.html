<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Book List</title>
	</head>
	<body>
		<h1>Book List</h1>
		<!-- 
		<p th:text="${books}"></p>
		 -->
		數量: <span th:text="${#lists.size(books)}">0</span> 本
		
		<!-- 書籍列表 -->
		<fieldset>
			<legend>書籍列表</legend>
			<table border="1">
				<thead>
					<tr>
						<th>序號</th>
						<th>書名</th>
						<th>價格</th>
						<th>數量</th>
						<th>出刊</th>
						
					</tr>
				</thead>
			
			</table>
		</fieldset>
		
	</body>
</html>
