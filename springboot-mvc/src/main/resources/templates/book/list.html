<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Book List</title>
	</head>
	<body>
		<h1>Book List</h1>
		
		<p th:text="${books}"></p>
		
		<!-- 書籍新增 -->
		<form method="post" th:action="@{/ssr/book}">
			<fieldset>
				<legend>書籍新增</legend>
				書名: <input type="text" name="name" required /><p />
				價格: <input type="number" name="price" min="1" step="0.5" max="10000" required /><p />
				數量: <input type="number" name="amount" min="1" step="1" max="10000" required /><p />
				出刊: <input type="checkbox" name="pub" /><p />
				<button type="submit">新增</button>
			</fieldset>
		</form>
		
		數量: <span th:text="${#lists.size(books)}">0</span> 本
		
		<!-- 書籍列表 -->
		<fieldset>
			<legend>書籍列表</legend>
			<table border="1">
				<thead>
					<tr>
						<th>序號</th>
						<th>書名</th>
						<th>價格</th>
						<th>數量</th>
						<th>出刊</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="book : ${books}">
						<td th:text="${book.id}"></td>
						<td th:text="${book.name}"></td>
						<td th:text="${book.price}"></td>
						<td th:text="${book.amount}"></td>
						<td th:text="${book.pub}"></td>
						<td>
							<form th:action="@{/ssr/book/edit}" method="post">
								<input type="hidden" name="id" th:value="${book.id}" />
								<button type="submit">編輯</button>
							</form>
						</td>
					</tr>
				</tbody>
							
			</table>
		</fieldset>
		
	</body>
</html>
