<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Study Thymeleaf</title>
	</head>
	<body>
		<!-- 
			1. th:text 輸出文字
		-->
		<h1 th:text="${title}">頁面標題</h1>
		
		<p>
			授課老師: <span th:text="${teacherName}">老師姓名</span>
		</p> 
		
		<!-- 
			2. th:if 條件成立才運行
		-->
		<p th:if="${message != null}">
			<span th:text="${message}">訊息內容</span>
		</p> 
		
		<p th:if="${message != null}" th:text="${message}">
			訊息內容
		</p>
		
		<!-- 
			3. th:unless 條件成立才運行
		-->
		<!-- 印出學生成績並判斷分數是否及格 -->
		<p th:if="${score != null}">
			學生成績: <span th:text="${score}">成績分數</span> 分
			<span th:if="${score >= 60}">及格</span>
			<span th:unless="${score >= 60}">不及格</span>
		</p>
		
		<!-- 
			4. #lists.isEmpty(x) 判斷集合是否是空的
		-->
		<p th:if="${#lists.isEmpty(studies)}">
			目前沒有任何課程
		</p>
		
		<!-- 
			5. #lists.size(x) 取得集合元素個數
			在此相當於可以取得目前有 n 門課程
		-->
		<p th:unless="${#lists.isEmpty(studies)}">
			目前共有 
			<span th:text="${#lists.size(studies)}">0</span> 
			門課程
		</p>
		
		<div th:unless="${#lists.isEmpty(studies)}">
			目前共有
			<span th:unless="${#lists.isEmpty(studies)}" th:text="${#lists.size(studies)}">
				 n 
			</span>
			門課程
		</div>
		
		<!-- 
			6. th:each 走訪集合
		-->
		<table border="1">
			<thead>
				<tr>
					<th>編號</th>
					<th>名稱</th>
					<th>時數</th>
					<th>程度</th>
					<th>程度</th>
					<th>操作</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="study : ${studies}">
					<td th:text="${study.id}">編號</td>
					<td th:text="${study.name}">名稱</td>
					<td th:text="${study.hours}">時數</td>
					<!-- 
						利用 th:if, th:unless
						時數 >= 10 顯示 [進階] 
						時數 <  10 顯示 [基礎]
					-->
					<td>
						<span th:if="${study.hours >= 10}">
							進階
						</span>
						<span th:unless="${study.hours >= 10}">
							基礎
						</span>
					</td>
					<td th:text="${study.hours >= 10 ? '進階' : '基礎'}">程度</td>
					<td>操作</td>
				</tr>
			</tbody>
		</table>
		<p />
		<!-- 
			7. th:action 指定表單送出往哪個網址
			@{/study/add} 是 Thymeleaf 的網址表達式
		-->
		<form th:action="@{/study/add}" method="post">
			<fieldset>
				<legend>新增課程</legend>
				名稱: <input type="text" name="name" required /><p />
				時數: <input type="number" name="hours" min="1" required /><p />
				<button type="submit">新增</button>
			</fieldset>
		</form>
	</body>
</html>
