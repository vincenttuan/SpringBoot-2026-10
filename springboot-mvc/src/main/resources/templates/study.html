<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Study Thymeleaf</title>
	</head>
	<body>
		<!-- 
			1. th:text 輸出文字
		-->
		<h1 th:text="${title}">頁面標題</h1>
		
		<p>
			授課老師: <span th:text="${teacherName}">老師姓名</span>
		</p> 
		
		<!-- 
			2. th:if 條件成立才運行
		-->
		<p th:if="${message != null}">
			<span th:text="${message}">訊息內容</span>
		</p> 
		
		<p th:if="${message != null}" th:text="${message}">
			訊息內容
		</p>
		 
	</body>
</html>
