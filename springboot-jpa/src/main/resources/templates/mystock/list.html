<!DOCTYPE html>
<!-- xmlns:th 宣告 Thymeleaf 的 th 屬性 -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>MyStock List</title>
	</head>
	<body>
		<!-- 
		<p th:text="${myStocks}"></p>
		-->
		<!-- 功能 -->
		<fieldset>
			<legend>功能</legend>
			<p>
				<a th:href="@{/mystock/new}">新增股票頁</a>
			</p>
		</fieldset>
		
		<!-- 分頁 -->
		<fieldset>
			<!-- 顯示總筆數 -->
			共 <span th:text="${myStockPage.totalElements}"></span> 筆
			｜
			第 <span th:text="${myStockPage.number + 1}"></span> 頁
			｜
			共 <span th:text="${myStockPage.totalPages}"></span> 頁
			　
			<a th:if="${myStockPage.hasPrevious()}" 
				th:href="@{/mystock(
							page=${myStockPage.number + 0},
							size=${myStockPage.size},
							sort=${sort},
							dir=${dir}
						)}">上一頁</a> 
			
			｜
			
			<!-- 頁碼列表: 1 2 3 4 ... -->
			<span th:each="p : ${#numbers.sequence(1, myStockPage.totalPages)}">
				<strong th:text="${p}" 
						th:if="${p == myStockPage.number + 1}"
						style="font-size:25px;color:red;margin:2px" >
				</strong>
				
				<a th:text="${p}"
				   th:unless="${p == myStockPage.number + 1}" 
				   th:href="@{/mystock(
							page=${p},
							size=${myStockPage.size},
							sort=${sort},
							dir=${dir}
						)}" 
					style="margin:2px">
				</a>
			</span>
			
			｜
			
			<a th:if="${myStockPage.hasNext()}"
				th:href="@{/mystock(
							page=${myStockPage.number + 2},
							size=${myStockPage.size},
							sort=${sort},
							dir=${dir}
						)}">下一頁</a> 
			
		</fieldset>
		
		<fieldset>
			<legend>MyStock List</legend>
			
			<table border="1" width="100%" cellpadding="4" cellspacing="0">
				<thead>
					<tr bgcolor="#CCCCCC">
						<th>
							<a th:href="@{/mystock(
											page=${myStockPage.number + 1},
											size=${myStockPage.size},
											sort='id',
											dir='asc'
										)}">▲</a>
							序號 (id)
							<a th:href="@{/mystock(
											page=${myStockPage.number + 1},
											size=${myStockPage.size},
											sort='id',
											dir='desc'
										)}">▼</a>
								
						</th>
						<th>股票代號 (symbol)</th>
						<th>股票名稱 (name)</th>
						<th>股票價格 (price)</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="myStock : ${myStocks}" 
						onmouseover="this.style.backgroundColor='#dddddd'" 
						onmouseout="this.style.backgroundColor='#ffffff'">
						<td th:text="${myStock.id}" align="center"></td>
						<td th:text="${myStock.symbol}" 
							th:title="|${myStock.name} 目前市價: ${#numbers.formatDecimal(myStock.price, 1, 'COMMA', 2, 'POINT')} 元|"
							onmouseover="this.style.cursor='pointer'" 
							onmouseout="this.style.cursor='default'"
							>
						</td>
						<td th:text="${myStock.name}"></td>
						<td th:text="${myStock.price}" align="right"></td>
						<td></td>
					</tr>
				</tbody>
				
			</table>
			
		</fieldset>
		
	</body>
</html>
