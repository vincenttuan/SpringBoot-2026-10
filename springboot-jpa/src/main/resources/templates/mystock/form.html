<!DOCTYPE html>
<!-- xmlns:th 宣告 Thymeleaf 的 th 屬性 -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>MyStock Form</title>
	</head>
	<body>
		<!-- 功能 -->
		<fieldset>
			<legend>功能</legend>
			<p>
				<a th:href="@{/mystock}">回股票列表頁</a>
			</p>
		</fieldset>
		<form method="post" th:object="${myStockForm}" th:action="@{/mystock}">
			<fieldset>
				<legend>MyStock 表單</legend>
				股票代號：<input th:field="*{symbol}" />
				<p />
				股票名稱：<input th:field="*{name}" />
				<p />
				股票價格：<input th:field="*{price}" />
				<p />
				<button type="submit">傳送</button>
			</fieldset>
		</form>
		
		
	</body>
</html>
